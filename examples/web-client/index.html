<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UCVE Web Client Demo</title>
</head>
<body>
  <h1>UCVE Real-Time Talking Session Web Client</h1>
  <button id="connectBtn">Connect Session</button>
  <button id="disconnectBtn">Disconnect</button>
  <div id="status">Status: Disconnected</div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDiv = document.getElementById('status');
    let ws = null;

    connectBtn.onclick = () => {
      const token = prompt('Enter session JWT token:');
      if (!token) return;
      ws = new WebSocket(`ws://localhost:8080/ws/audio?token=${token}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => { statusDiv.textContent = 'Status: Connected'; };
      ws.onclose = () => { statusDiv.textContent = 'Status: Disconnected'; };
      ws.onerror = (err) => { console.error('WS Error', err); };
    };

    disconnectBtn.onclick = () => {
      if (ws) ws.close();
    };
  </script>
</body>
</html>
