[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucve-monorepo"
version = "0.1.0"
description = "Unified Core Voice Engine (UCVE) Sovereign Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.uv.workspace]
members = ["core"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true
