[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucve-monorepo"
version = "0.1.0"
description = "Wavia — Sovereign Real-Time Voice AI Engine (UCVE Architecture)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.0",
    "PyJWT>=2.9.0",
    "PyYAML>=6.0.2",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
    "redis>=5.0.0",
    "tokenizers>=0.20.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
knowledge-s3 = ["boto3>=1.35.0"]

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "control_plane",
    "worker_raw",
    "telephony_gateway",
    "post_call",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = ["core", "control_plane", "worker_raw", "telephony_gateway", "post_call"]

[tool.uv.sources]
core = { workspace = true }
control-plane = { workspace = true }
worker-raw = { workspace = true }
telephony-gateway = { workspace = true }
post-call = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "voice_engine_plan/tests"]
norecursedirs = ["legacy_codebases", ".git", ".venv", "node_modules", "dist", "build"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
