[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucve-monorepo"
version = "0.1.0"
description = "Wavia — Sovereign Real-Time Voice AI Engine (UCVE Architecture)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "core",
    "control-plane",
    "worker-raw",
    "telephony-gateway",
    "post-call",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = ["core", "control_plane", "worker_raw", "telephony_gateway", "post_call"]

[tool.uv.sources]
core = { workspace = true }
control-plane = { workspace = true }
worker-raw = { workspace = true }
telephony-gateway = { workspace = true }
post-call = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "voice_engine_plan/tests"]
norecursedirs = ["legacy_codebases", ".git", ".venv", "node_modules", "dist", "build"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
