[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core"
version = "0.1.0"
description = "UCVE Core Kernel & Domain Contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "PyJWT>=2.9.0",
    "PyYAML>=6.0.2",
    "redis>=5.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]
