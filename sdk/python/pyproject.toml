[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucve-voice-sdk"
version = "1.0.4"
description = "Official Python Client SDK for Wavia Real-Time Sovereign Voice AI Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ucve"]

[tool.hatch.build.targets.sdist]
include = ["/ucve", "/README.md", "/pyproject.toml"]
