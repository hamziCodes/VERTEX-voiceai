# UCVE single-node stack (Foundation Hardening H0+)
# Usage: docker compose --env-file .env.example up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ucve}
      POSTGRES_USER: ${POSTGRES_USER:-ucve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucve_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucve}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ../..
      dockerfile: infra/docker/control-plane.Dockerfile
    ports:
      - "8080:8080"
    environment:
      UCVE_ENV: ${UCVE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ucve}:${POSTGRES_PASSWORD:-ucve_dev}@postgres:5432/${POSTGRES_DB:-ucve}
      REDIS_URL: redis://redis:6379/0
      UCVE_JWT_SECRET: ${UCVE_JWT_SECRET:-dev-only-replace-me-jwt-32chars-min}
      UCVE_MINT_HMAC_SECRET: ${UCVE_MINT_HMAC_SECRET:-dev-only-replace-me-mint-hmac-32}
      UCVE_METRICS_BEARER: ${UCVE_METRICS_BEARER:-dev-only-replace-me-metrics-bearer}
      UCVE_WS_PUBLIC_URL: ${UCVE_WS_PUBLIC_URL:-ws://localhost:8081/ws/audio}
      UCVE_MASTER_KEY: ${UCVE_MASTER_KEY:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      PLATFORM_GLADIA_API_KEY: ${PLATFORM_GLADIA_API_KEY:-}
      PLATFORM_GROQ_API_KEY: ${PLATFORM_GROQ_API_KEY:-}
      PLATFORM_UPLIFT_API_KEY: ${PLATFORM_UPLIFT_API_KEY:-}
      OTEL_EXPORTER_ENABLED: ${OTEL_EXPORTER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker-raw:
    build:
      context: ../..
      dockerfile: infra/docker/worker-raw.Dockerfile
    ports:
      - "8081:8081"
    environment:
      UCVE_ENV: ${UCVE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ucve}:${POSTGRES_PASSWORD:-ucve_dev}@postgres:5432/${POSTGRES_DB:-ucve}
      REDIS_URL: redis://redis:6379/0
      UCVE_JWT_SECRET: ${UCVE_JWT_SECRET:-dev-only-replace-me-jwt-32chars-min}
      UCVE_WS_PUBLIC_URL: ${UCVE_WS_PUBLIC_URL:-ws://localhost:8081/ws/audio}
      UCVE_MASTER_KEY: ${UCVE_MASTER_KEY:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      PLATFORM_GLADIA_API_KEY: ${PLATFORM_GLADIA_API_KEY:-}
      PLATFORM_GROQ_API_KEY: ${PLATFORM_GROQ_API_KEY:-}
      PLATFORM_UPLIFT_API_KEY: ${PLATFORM_UPLIFT_API_KEY:-}
      UCVE_RUNTIME_PROFILE: ${UCVE_RUNTIME_PROFILE:-dev}
      UCVE_ENABLE_LIVEKIT: "false"
      OMP_NUM_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
