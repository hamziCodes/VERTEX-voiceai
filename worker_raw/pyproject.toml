[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker-raw"
version = "0.1.0"
description = "UCVE sovereign pipeline worker (WebSocket audio)"
requires-python = ">=3.12"
dependencies = [
    "core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "PyJWT>=2.9.0",
    "pydantic>=2.9.0",
]

[tool.uv.sources]
core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
