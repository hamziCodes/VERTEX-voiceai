components:
  schemas:
    AcceptInvitationBody:
      properties:
        token:
          type: string
          maxLength: 1024
          minLength: 20
          title: Token
      type: object
      required:
      - token
      title: AcceptInvitationBody
    AutosavePatchBody:
      properties:
        patch:
          additionalProperties: true
          type: object
          title: Patch
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
        debounce_seconds:
          type: number
          title: Debounce Seconds
          default: 30.0
        force:
          type: boolean
          title: Force
          default: false
      type: object
      required:
      - patch
      - expected_revision
      title: AutosavePatchBody
    Body_upload_knowledge_source_v1_knowledge_bases__knowledge_base_id__sources_post:
      properties:
        source:
          type: string
          contentMediaType: application/octet-stream
          title: Source
      type: object
      required:
      - source
      title: Body_upload_knowledge_source_v1_knowledge_bases__knowledge_base_id__sources_post
    ChangeMemberRoleBody:
      properties:
        role:
          type: string
          enum:
          - tenant_admin
          - tenant_editor
          - tenant_developer
          - tenant_viewer
          - compliance_admin
          title: Role
      type: object
      required:
      - role
      title: ChangeMemberRoleBody
    CreateAPIKeyBody:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          default:
          - session:mint
        role:
          type: string
          title: Role
          default: tenant_viewer
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - name
      title: CreateAPIKeyBody
    CreateAgentBody:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        description:
          type: string
          title: Description
          default: ''
        persona:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Persona
        languages:
          items:
            type: string
          type: array
          title: Languages
